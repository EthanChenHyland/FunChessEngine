name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: make gate
      - run: make verify-zip
      - run: node --check gui/static/app.js
      - run: npm ci
        working-directory: desktop
      - run: npm run check
        working-directory: desktop
      - run: npm audit
        working-directory: desktop
      - name: Configure Electron SUID sandbox
        run: |
          node node_modules/electron/install.js
          ELECTRON_PATH="$(node -p "require('electron')")"
          SANDBOX_PATH="$(dirname "$ELECTRON_PATH")/chrome-sandbox"
          test -f "$SANDBOX_PATH"
          sudo chown root:root "$SANDBOX_PATH"
          sudo chmod 4755 "$SANDBOX_PATH"
        working-directory: desktop
      - run: xvfb-run -a npm run smoke:ui
        working-directory: desktop

  portable-processes:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12.14"
      - run: uv sync --frozen
      - run: uv run python -m unittest tests.test_integrations tests.test_arena tests.test_audit_repairs
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --test tests/frontend-behavior.cjs
