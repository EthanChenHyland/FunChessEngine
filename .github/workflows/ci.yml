name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12.14"
          enable-cache: true
      - run: uv sync --frozen
      - run: make gate
      - run: make verify-zip
      - run: node --check gui/static/app.js
      - run: npm ci
        working-directory: desktop
      - run: npm run check
        working-directory: desktop
      - run: npm audit
        working-directory: desktop
      - run: xvfb-run -a npm run smoke:ui
        working-directory: desktop
